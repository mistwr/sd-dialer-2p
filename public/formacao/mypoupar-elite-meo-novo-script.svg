<rect x="88" y="330" width="904" height="126" rx="24" fill="#152544"/><text x="126" y="380" font-size="30" font-weight="800" fill="#F5B51B">1. REGISTA SEMPRE</text><text x="126" y="423" font-size="24" fill="#EAF0FB">Todas as vendas devem ficar no CRM / SD Dialer.</text>
<rect x="88" y="488" width="904" height="126" rx="24" fill="#152544"/><text x="126" y="538" font-size="30" font-weight="800" fill="#F5B51B">2. ACOMPANHA O ESTADO</text><text x="126" y="581" font-size="24" fill="#EAF0FB">Do registo até à instalação, sem perder clientes ou comissões.</text>
<rect x="88" y="646" width="904" height="126" rx="24" fill="#152544"/><text x="126" y="696" font-size="30" font-weight="800" fill="#F5B51B">3. ORGANIZA O FOLLOW-UP</text><text x="126" y="739" font-size="24" fill="#EAF0FB">Quanto melhor a organização, mais fácil fechar e recuperar oportunidades.</text>
<rect x="88" y="804" width="904" height="126" rx="24" fill="#152544"/><text x="126" y="854" font-size="30" font-weight="800" fill="#F5B51B">4. TELECOM + ENERGIA</text><text x="126" y="897" font-size="24" fill="#EAF0FB">Cada contacto pode gerar duas oportunidades de poupança.</text>
<rect x="88" y="962" width="904" height="126" rx="24" fill="#152544"/><text x="126" y="1012" font-size="30" font-weight="800" fill="#F5B51B">5. PRÓXIMO PASSO DEFINIDO</text><text x="126" y="1055" font-size="24" fill="#EAF0FB">Venda · Follow-up · Interessado · Sem interesse · Inválido.</text>
<rect x="88" y="1150" width="904" height="102" rx="24" fill="#F5B51B"/><text x="540" y="1212" text-anchor="middle" font-size="30" font-weight="900" fill="#07111F">MÉTODO + ACOMPANHAMENTO + AÇÃO</text>
