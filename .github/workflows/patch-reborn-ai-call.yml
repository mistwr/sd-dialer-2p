name: Restore Direct Partner Calls

on:
  push:
    paths:
      - '.github/workflows/patch-reborn-ai-call.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore native tel protocol
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('app/(dashboard)/parceiro/leads/[id]/page.tsx')
          s = p.read_text()

          direct = '''  const handleCall = () => {
    if (!lead) return
    const phone = lead.telefone.replace(/[^0-9+]/g, '')
    if (!phone) return
    callInitiated.current = true
    startTimer()
    window.location.href = `tel:${phone}`
  }

'''

          pattern = r"  const handleCall = async \(\) => \{.*?\n\}\n\n  const handleWhatsApp"
          replaced, count = re.subn(pattern, direct + '  const handleWhatsApp', s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Current REBORN handleCall block not found; refusing blind patch')

          replaced = replaced.replace(
              "{timerActive ? `IA em chamada — ${formatDuration(elapsed)}` : 'Iniciar chamada com IA'}",
              "{timerActive ? `Em chamada — ${formatDuration(elapsed)}` : `Chamar  ${lead.telefone}`}",
              1,
          )

          p.write_text(replaced)

      - name: Commit patch
        run: |
          git config user.name "SD Dialer Bot"
          git config user.email "sd-dialer-bot@users.noreply.github.com"
          git add 'app/(dashboard)/parceiro/leads/[id]/page.tsx'
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore native direct calling'
          git push origin main
